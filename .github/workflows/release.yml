# 비공개 소스 저장소(StaticDuo/hwp-assist-src)에 v로 시작하는 태그가 새로 생기면
# Windows 설치 파일을 만들어 이 저장소의 릴리스로 올린다.
#
# - 하루 두 번(한국 시간 09:17, 21:17) 새 태그가 있는지 확인한다(예약 실행은 실행한 사람이 기록되지 않는다).
# - 급하면 Actions 탭의 "Run workflow"로 바로 실행한다(이때는 실행한 계정이 기록된다).
#   "점검만"을 켜면 이미 있는 버전도 다시 빌드·점검하고 릴리스는 올리지 않는다.
# - 설치 파일은 올리기 전에 깨끗한 러너에서 실제로 설치 → 실행 → 제거해 본다.
#   자체 점검 화면과 설치 로그는 실행 결과의 Artifacts(qa-버전)에서 볼 수 있다.
# - 소스는 hwp-assist-src 하나만 읽을 수 있는 읽기 전용 토큰(secrets.SRC_TOKEN)으로 가져온다.
# - 릴리스는 GITHUB_TOKEN으로 만들므로 작성자는 github-actions 봇이다.
name: release

on:
  schedule:
    - cron: "17 0,12 * * *" # UTC 00:17, 12:17 = 한국 09:17, 21:17
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.1.0). 비우면 소스 저장소의 최신 태그"
        required: false
      dry_run:
        description: "점검만 (릴리스는 올리지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SRC_REPO: StaticDuo/hwp-assist-src

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.find.outputs.version }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - name: 새 버전 찾기
        id: find
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$SRC_TOKEN" ]; then echo "SRC_TOKEN 비밀값이 없습니다"; exit 1; fi
          if [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
          else
            v=$(git ls-remote --tags --refs "https://x-access-token:${SRC_TOKEN}@github.com/${SRC_REPO}.git" 'v*' \
                | sed 's#.*refs/tags/v##' | sort -V | tail -1)
          fi
          if [ -z "$v" ]; then echo "태그가 아직 없습니다"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "v$v 를 점검만 합니다"; echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v 릴리스가 이미 있습니다"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v 를 만듭니다"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: pub

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SRC_REPO }}
          ref: v${{ env.VERSION }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
          path: src

      - name: 버전 기록
        shell: bash
        run: echo "__version__ = \"$VERSION\"" > src/hwp_assist/_version.py

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (v8부터 주 버전 태그가 없어 커밋으로 고정)
        with:
          python-version: "3.12"

      - name: 시험
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: 실행 파일 만들기 (PyInstaller)
        run: uv run --with pyinstaller pyinstaller packaging/hwp-assist.spec --noconfirm --distpath dist --workpath build

      - name: 실행 파일 자체 점검 (창을 띄워 캡처)
        shell: pwsh
        run: |
          $env:HWP_ASSIST_SMOKE = "$PWD\smoke.png"
          $p = Start-Process dist\hwp-assist\hwp-assist.exe -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.png)) { throw "실행 파일이 정상적으로 뜨지 않았습니다" }

      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging\installer.iss "/DAppVersion=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했습니다" }

      - name: 설치본 점검 (설치 → 실행 → 제거)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $app = "$env:LOCALAPPDATA\Programs\hwp-assist"
          $p = Start-Process "dist\hwp-assist-setup-$env:VERSION.exe" -PassThru -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\install.log"
          if ($p.ExitCode -ne 0) { throw "설치에 실패했습니다 (종료 코드 $($p.ExitCode))" }
          if (-not (Test-Path "$app\hwp-assist.exe")) { throw "설치 폴더에 실행 파일이 없습니다: $app" }

          # 바로가기처럼 설치 폴더에서 실행한다
          $env:HWP_ASSIST_SMOKE = "$PWD\smoke-installed.png"
          $p = Start-Process "$app\hwp-assist.exe" -WorkingDirectory $app -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-installed.png)) { throw "설치된 프로그램이 정상적으로 뜨지 않았습니다" }

          # 제거 프로그램은 임시 폴더로 자신을 복사해 돌고 바로 끝나므로, 설치 폴더가 사라질 때까지 기다린다
          Start-Process "$app\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\hwp-assist.exe") { throw "제거 후에도 실행 파일이 남아 있습니다" }
          if (Test-Path $app) {
            Write-Output "::warning::제거 후 남은 파일:"
            Get-ChildItem $app -Recurse | ForEach-Object { $_.FullName }
          }

      - name: 점검 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ env.VERSION }}
          path: |
            src/smoke.png
            src/smoke-installed.png
            src/install.log
          if-no-files-found: warn
          retention-days: 30

      - name: 릴리스 올리기
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 버전 없는 이름도 함께 올려 고정 링크(releases/latest/download/hwp-assist-setup.exe)가 늘 최신을 가리키게 한다.
          # GitHub의 "최신"은 prerelease를 빼고 고르므로 --latest로 올린다. 시험판이라는 표시는 제목에 둔다.
          cp "dist/hwp-assist-setup-$VERSION.exe" dist/hwp-assist-setup.exe
          gh release create "v$VERSION" "dist/hwp-assist-setup-$VERSION.exe" dist/hwp-assist-setup.exe \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "hwp-assist $VERSION (시험판)" --notes-file ../pub/release-notes.md --latest
